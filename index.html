<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#063d47">
<title>Caribbean Dash — Playable Prototype</title>
<style>
:root{--ink:#073b43;--gold:#ffd45d;--mint:#b6f1c9}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#063d47;color:white;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}#game{display:block;width:100vw;height:100dvh}#hud{position:fixed;top:env(safe-area-inset-top,12px);left:0;right:0;display:flex;justify-content:space-between;padding:14px;pointer-events:none;text-shadow:0 2px 8px #06333a;font-weight:900;letter-spacing:.04em}.pill{background:#063b43c9;border:1px solid #ffffff44;border-radius:14px;padding:9px 12px;font-size:13px}.big{font-size:18px;color:var(--gold)}#help{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:12px;right:12px;text-align:center;font-size:12px;color:#fff;text-shadow:0 2px 6px #00343b;pointer-events:none}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#002f38a8}#panel{max-width:360px;width:100%;text-align:center;padding:26px 22px;border-radius:28px;background:linear-gradient(160deg,#08717a,#06404c);border:1px solid #b8f4d677;box-shadow:0 18px 60px #001c28a8}h1{margin:0 0 8px;font-size:32px;line-height:1;color:var(--gold)}p{line-height:1.45;color:#e0fbef}.btn{border:0;border-radius:16px;background:var(--gold);color:#153b3d;font-weight:900;font-size:16px;padding:14px 20px;width:100%;margin-top:8px;box-shadow:0 5px 0 #b87b26}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b87b26}.small{font-size:12px;opacity:.85}
</style></head><body>
<canvas id="game"></canvas><div id="hud"><div class="pill">DISTANCE <span class="big" id="distance">0</span> m</div><div class="pill">🪙 <span class="big" id="coins">0</span></div></div><div id="help">SWIPE ← → TO DODGE · SWIPE ↑ TO JUMP · TAP BUTTONS IF YOU PREFER</div>
<div id="overlay"><div id="panel"><div style="font-size:42px;margin-bottom:8px">🌴</div><h1>CARIBBEAN DASH</h1><p>Dash along a tropical island, collect golden coins, and dodge beach obstacles.</p><p class="small">Swipe left/right to change lanes. Swipe up to jump.</p><button class="btn" id="start">START RUN</button></div></div>
<script>
(()=>{const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),panel=document.querySelector('#panel'),start=document.querySelector('#start');let W,H,dpr,playing=false,dead=false,lane=1,playerY=0,jumpV=0,dist=0,coins=0,speed=0.34,last=0,spawn=0,items=[],touch=null,buttons=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){playing=true;dead=false;lane=1;playerY=0;jumpV=0;dist=0;coins=0;speed=.34;spawn=0;items=[];overlay.style.display='none';last=performance.now();requestAnimationFrame(loop)}
function finish(){playing=false;dead=true;overlay.style.display='flex';panel.innerHTML=`<div style="font-size:42px">${coins>=15?'🏆':'💦'}</div><h1>${coins>=15?'NICE RUN!':'RUN OVER'}</h1><p>You travelled <b>${Math.floor(dist)} m</b> and collected <b>${coins} coins</b>.</p><button class="btn" id="again">RUN AGAIN</button><p class="small">Prototype build · more islands and characters coming next</p>`;document.querySelector('#again').onclick=reset}
function action(a){if(!playing)return;if(a==='left')lane=Math.max(0,lane-1);if(a==='right')lane=Math.min(2,lane+1);if(a==='jump'&&playerY<=0){jumpV=11.5}}
function project(z,l){let p=Math.max(0,Math.min(1,1-z/100));let y=H*.28+p*p*H*.7;let spread=(W*.06+p*W*.34);let x=W/2+(l-1)*spread;let scale=.2+p*1.4;return{x,y,scale,p}}
function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#48c8df');sky.addColorStop(.55,'#b2f0d6');sky.addColorStop(1,'#f8d99a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
// sun and distant islands
ctx.fillStyle='#ffe99b';ctx.beginPath();ctx.arc(W*.78,H*.16,Math.min(W,H)*.07,0,Math.PI*2);ctx.fill();ctx.fillStyle='#168b83';ctx.beginPath();ctx.moveTo(0,H*.43);ctx.quadraticCurveTo(W*.16,H*.26,W*.34,H*.43);ctx.quadraticCurveTo(W*.52,H*.3,W*.69,H*.43);ctx.quadraticCurveTo(W*.86,H*.25,W,H*.42);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
// sea-side ground
ctx.fillStyle='#e9c77c';ctx.beginPath();ctx.moveTo(W*.42,H*.38);ctx.lineTo(W*.58,H*.38);ctx.lineTo(W*1.18,H);ctx.lineTo(-W*.18,H);ctx.closePath();ctx.fill();ctx.fillStyle='#b88c50';ctx.beginPath();ctx.moveTo(W*.46,H*.38);ctx.lineTo(W*.54,H*.38);ctx.lineTo(W*.82,H);ctx.lineTo(W*.18,H);ctx.closePath();ctx.fill();
// lanes
ctx.strokeStyle='#fff4cb99';ctx.lineWidth=2;for(let l=0;l<2;l++){let x1=W/2+(l-0.5)*W*.04,x2=W/2+(l-0.5)*W*.6;ctx.beginPath();ctx.moveTo(x1,H*.4);ctx.lineTo(x2,H);ctx.stroke()}
// palms at edges
for(let i=0;i<5;i++){let y=H*(.38+i*.13),s=.3+i*.25;let side=i%2?1:-1,x=W/2+side*(W*.26+i*W*.09);ctx.strokeStyle='#76502b';ctx.lineWidth=5*s;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-side*10*s,y-38*s);ctx.stroke();ctx.strokeStyle='#087d56';ctx.lineWidth=5*s;for(let k=0;k<5;k++){ctx.beginPath();ctx.moveTo(x-side*10*s,y-38*s);ctx.quadraticCurveTo(x+(k-2)*22*s,y-65*s,x+(k-2)*33*s,y-38*s);ctx.stroke()}}
// items far to near
items.sort((a,b)=>b.z-a.z);for(let it of items){let q=project(it.z,it.l);if(it.type==='coin'){ctx.fillStyle='#b86b12';ctx.beginPath();ctx.ellipse(q.x,q.y-10*q.scale,8*q.scale,12*q.scale,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffdb51';ctx.beginPath();ctx.ellipse(q.x,q.y-11*q.scale,6*q.scale,10*q.scale,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9d6a17';ctx.font=`bold ${10*q.scale+5}px system-ui`;ctx.textAlign='center';ctx.fillText('$',q.x,q.y-7*q.scale)}else{ctx.fillStyle=it.type==='log'?'#8c4b25':'#dc684b';ctx.beginPath();if(it.type==='rock'){ctx.moveTo(q.x-15*q.scale,q.y);ctx.lineTo(q.x-10*q.scale,q.y-24*q.scale);ctx.lineTo(q.x+10*q.scale,q.y-25*q.scale);ctx.lineTo(q.x+18*q.scale,q.y);ctx.closePath()}else{ctx.roundRect(q.x-17*q.scale,q.y-22*q.scale,34*q.scale,24*q.scale,5*q.scale)}ctx.fill();ctx.fillStyle='#ffffff55';ctx.fillRect(q.x-10*q.scale,q.y-17*q.scale,5*q.scale,10*q.scale)}}
// player shadow and character
let px=W/2+(lane-1)*W*.24,py=H*.79-playerY;ctx.fillStyle='#3a604e66';ctx.beginPath();ctx.ellipse(px,H*.8,22,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f7b34d';ctx.beginPath();ctx.arc(px,py-42,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe0b2';ctx.beginPath();ctx.arc(px,py-43,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e74f3f';ctx.fillRect(px-13,py-29,26,28);ctx.fillStyle='#124f59';ctx.fillRect(px-12,py-3,9,18);ctx.fillRect(px+3,py-3,9,18);ctx.strokeStyle='#ffe0b2';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(px-11,py-24);ctx.lineTo(px-21,py-8);ctx.moveTo(px+11,py-24);ctx.lineTo(px+21,py-8);ctx.stroke();
// touch controls
ctx.textAlign='center';ctx.font='bold 12px system-ui';[['◀',W*.15,'left'],['▲',W*.5,'jump'],['▶',W*.85,'right']].forEach(([t,x,a])=>{ctx.fillStyle='#06465077';ctx.beginPath();ctx.arc(x,H*.91,25,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffffff88';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(t,x,H*.915);});}
function loop(now){if(!playing)return;let dt=Math.min((now-last)/16.67,2);last=now;dist+=speed*dt*2.2;speed=Math.min(.65,speed+.00008*dt);if(playerY>0||jumpV>0){playerY+=jumpV*dt;jumpV-=.7*dt;if(playerY<0){playerY=0;jumpV=0}}
spawn+=dt;if(spawn>Math.max(19,38-speed*20)){spawn=0;let l=Math.floor(Math.random()*3),type=Math.random()<.42?'coin':(['rock','log'][Math.floor(Math.random()*2)]);if(type==='coin'){for(let n=0;n<3;n++)items.push({z:100+n*5,l,type})}else items.push({z:100,l,type})}
for(let it of items){it.z-=speed*dt*2.6;if(it.z<5&&it.z>-3&&it.l===lane){if(it.type==='coin'){coins++;it.z=-99}else if(playerY<18){finish();return}else it.z=-99}}
items=items.filter(i=>i.z>-5);document.querySelector('#distance').textContent=Math.floor(dist);document.querySelector('#coins').textContent=coins;draw();requestAnimationFrame(loop)}
let startX=0,startY=0;canvas.addEventListener('touchstart',e=>{const t=e.changedTouches[0];startX=t.clientX;startY=t.clientY},{passive:false});canvas.addEventListener('touchend',e=>{e.preventDefault();const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<22){if(startY>H*.84){if(startX<W*.32)action('left');else if(startX>W*.68)action('right');else action('jump')}return}if(Math.abs(dx)>Math.abs(dy))action(dx<0?'left':'right');else if(dy<0)action('jump')},{passive:false});canvas.addEventListener('click',e=>{if(e.clientY>H*.84){if(e.clientX<W*.32)action('left');else if(e.clientX>W*.68)action('right');else action('jump')}});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')action('left');if(e.key==='ArrowRight'||e.key==='d')action('right');if(e.key==='ArrowUp'||e.key===' ')action('jump')});start.onclick=reset;draw();})();
</script></body></html>
